<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GastroSync Pro - Gestión de Pedidos en Tiempo Real</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (Versión UMD específica para evitar conflictos de módulos ESM) -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para transpilar JSX en caliente -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Configuración de Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2 family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Estilos personalizados para barra de scroll elegante */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 transition-colors duration-200">
  <div id="root"></div>

  <!-- Configuración segura de Babel para forzar el runtime clásico sin conflictos de importSource -->
  <script>
    if (window.Babel) {
      Babel.registerPreset('custom-react', {
        presets: [
          [Babel.availablePresets['env'], { modules: false }],
          [Babel.availablePresets['react'], { runtime: 'classic' }]
        ]
      });
    }
  </script>

  <script type="text/babel" data-presets="custom-react">
    const { useState, useEffect, useRef } = React;

    const CODIGO_ACCESO_CORRECTO = "901310148";

    function App() {
      // --- CONTROL DE ACCESO GENERAL ---
      const [accesoAutorizado, setAccesoAutorizado] = useState(() => {
        return localStorage.getItem('gastrosync_acceso_general') === 'confirmado';
      });
      const [codigoInput, setCodigoInput] = useState("");
      const [errorCodigo, setErrorCodigo] = useState("");

      // --- ROLES Y ESTADOS DEL SISTEMA ---
      const [role, setRole] = useState(null); // 'mesero' | 'cocina' | 'admin' | null
      
      // El menú por defecto inicia completamente vacío para evitar productos automáticos o mock data
      const [menu, setMenu] = useState(() => {
        const saved = localStorage.getItem('gastrosync_menu');
        return saved ? JSON.parse(saved) : [];
      });
      
      const [categorias, setCategorias] = useState(() => {
        const saved = localStorage.getItem('gastrosync_categorias');
        return saved ? JSON.parse(saved) : ["Entradas", "Platos Fuertes", "Bebidas", "Postres"];
      });

      const [pedidos, setPedidos] = useState(() => {
        const saved = localStorage.getItem('gastrosync_pedidos');
        return saved ? JSON.parse(saved) : [];
      });

      const [adminPassword, setAdminPassword] = useState(() => {
        return localStorage.getItem('gastrosync_admin_pass') || "admin123";
      });

      // Preferencia de tema (oscuro/claro)
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('gastrosync_theme') === 'dark';
      });

      // Estados de control para formularios y modales de seguridad
      const [modalPasswordAdmin, setModalPasswordAdmin] = useState(false);
      const [passInput, setPassInput] = useState("");
      const [passError, setPassError] = useState("");
      const [notificacion, setNotificacion] = useState(null);

      // --- SINCRONIZADORES DE PERSISTENCIA ---
      useEffect(() => {
        localStorage.setItem('gastrosync_menu', JSON.stringify(menu));
      }, [menu]);

      useEffect(() => {
        localStorage.setItem('gastrosync_categorias', JSON.stringify(categorias));
      }, [categorias]);

      useEffect(() => {
        localStorage.setItem('gastrosync_pedidos', JSON.stringify(pedidos));
      }, [pedidos]);

      useEffect(() => {
        localStorage.setItem('gastrosync_theme', darkMode ? 'dark' : 'light');
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Inicialización periódica de iconos de Lucide
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Helper para alertas temporales no intrusivas
      const mostrarNotificacion = (mensaje, tipo = 'success') => {
        setNotificacion({ mensaje, tipo });
        setTimeout(() => setNotificacion(null), 4000);
      };

      // --- SINCRONIZACIÓN EN TIEMPO REAL ENTRE DISPOSITIVOS / PESTAÑAS ---
      useEffect(() => {
        const handleStorageChange = (e) => {
          if (e.key === 'gastrosync_pedidos') {
            setPedidos(JSON.parse(e.newValue || '[]'));
            mostrarNotificacion("Sincronización: Pedidos actualizados en tiempo real", "info");
          }
          if (e.key === 'gastrosync_menu') {
            setMenu(JSON.parse(e.newValue || '[]'));
            mostrarNotificacion("Sincronización: Menú actualizado en tiempo real", "info");
          }
          if (e.key === 'gastrosync_categorias') {
            setCategorias(JSON.parse(e.newValue || '[]'));
          }
          if (e.key === 'gastrosync_acceso_general' && e.newValue !== 'confirmado') {
            setAccesoAutorizado(false);
            setRole(null);
          }
        };
        window.addEventListener('storage', handleStorageChange);
        return () => window.removeEventListener('storage', handleStorageChange);
      }, []);

      // --- CONTROL DE ACCESO GENERAL MANDATORIO ---
      const verificarCodigoGeneral = (e) => {
        e.preventDefault();
        if (codigoInput.trim() === CODIGO_ACCESO_CORRECTO) {
          setAccesoAutorizado(true);
          localStorage.setItem('gastrosync_acceso_general', 'confirmado');
          setErrorCodigo("");
          setCodigoInput("");
          mostrarNotificacion("Código de acceso correcto. Bienvenido al sistema global.", "success");
        } else {
          setErrorCodigo("Código de acceso incorrecto. Intente nuevamente.");
        }
      };

      const revocarAccesoGeneral = () => {
        setAccesoAutorizado(false);
        setRole(null);
        localStorage.removeItem('gastrosync_acceso_general');
        mostrarNotificacion("Acceso general revocado.", "info");
      };

      // --- ACCESO PANEL ADMINISTRATIVO ---
      const intentarAccesoAdmin = () => {
        if (passInput === adminPassword) {
          setRole('admin');
          setModalPasswordAdmin(false);
          setPassInput("");
          setPassError("");
          mostrarNotificacion("Acceso Administrativo autorizado.", "success");
        } else {
          setPassError("Contraseña incorrecta. Intente de nuevo.");
        }
      };

      const cerrarSesionRol = () => {
        setRole(null);
        mostrarNotificacion("Sesión de rol finalizada.", "info");
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Notificaciones flotantes */}
          {notificacion && (
            <div className={`fixed bottom-4 right-4 z-50 p-4 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce border text-white ${
              notificacion.tipo === 'success' ? 'bg-emerald-600 border-emerald-500' :
              notificacion.tipo === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-indigo-600 border-indigo-500'
            }`}>
              <span className="font-bold text-sm">{notificacion.mensaje}</span>
              <button onClick={() => setNotificacion(null)} className="hover:opacity-75">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN */}
          <nav className="bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-zinc-800 sticky top-0 z-40 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center">
                    <i data-lucide="chef-hat" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <h1 className="text-xl font-black text-slate-900 dark:text-white tracking-tight flex items-center gap-1.5">
                      GastroSync <span className="text-indigo-600 dark:text-indigo-400 font-medium text-xs bg-indigo-50 dark:bg-indigo-950/50 px-2 py-0.5 rounded-full border border-indigo-100 dark:border-indigo-900">PRO</span>
                    </h1>
                    <p className="text-[10px] text-slate-400 dark:text-zinc-500 font-semibold tracking-wider uppercase">Sistema Cerrado de Pedidos</p>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  {/* Toggle Oscuro/Claro */}
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2 rounded-xl bg-slate-50 dark:bg-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-700 text-slate-600 dark:text-zinc-300 transition-all"
                    title="Alternar tema visual"
                  >
                    {darkMode ? <i data-lucide="sun" className="w-5 h-5"></i> : <i data-lucide="moon" className="w-5 h-5"></i>}
                  </button>

                  {accesoAutorizado && (
                    <div className="hidden sm:flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/30 px-3 py-1.5 rounded-xl border border-emerald-100 dark:border-emerald-900/30 text-emerald-700 dark:text-emerald-400">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span className="text-xs font-bold tracking-tight">Sincronización Activa</span>
                    </div>
                  )}

                  {role && (
                    <button 
                      onClick={cerrarSesionRol}
                      className="flex items-center gap-2 bg-rose-50 dark:bg-rose-950/30 hover:bg-rose-100 dark:hover:bg-rose-900/30 px-4 py-2 rounded-xl text-rose-600 dark:text-rose-400 text-sm font-bold transition-all border border-rose-100 dark:border-rose-900/20"
                    >
                      <i data-lucide="log-out" className="w-4 h-4"></i>
                      <span className="hidden md:inline">Cambiar Rol</span>
                    </button>
                  )}

                  {accesoAutorizado && !role && (
                    <button 
                      onClick={revocarAccesoGeneral}
                      className="flex items-center gap-2 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 px-4 py-2 rounded-xl text-slate-600 dark:text-zinc-300 text-sm font-bold transition-all border border-slate-200 dark:border-zinc-700"
                    >
                      <i data-lucide="shield-alert" className="w-4 h-4"></i>
                      <span className="hidden md:inline">Cerrar Sistema</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </nav>

          {/* SECCIONES Y VISTAS */}
          <main className="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            
            {/* 1. COMPROBACIÓN MANDATORIA DE CÓDIGO DE ACCESO */}
            {!accesoAutorizado ? (
              <div className="max-w-md mx-auto py-16 md:py-24">
                <div className="bg-white dark:bg-zinc-900 border border-slate-100 dark:border-zinc-800/80 p-8 rounded-3xl shadow-2xl space-y-6">
                  <div className="text-center">
                    <div className="inline-block bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 p-4 rounded-2xl mb-4 border border-indigo-100/50 dark:border-indigo-900/30">
                      <i data-lucide="shield-check" className="w-8 h-8"></i>
                    </div>
                    <h2 className="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Acceso Privado GastroSync</h2>
                    <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1.5 leading-relaxed">
                      Este terminal requiere el código general de seguridad para conectarse a la sesión compartida del establecimiento.
                    </p>
                  </div>

                  <form onSubmit={verificarCodigoGeneral} className="space-y-4">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider mb-2">Código de Acceso General</label>
                      <input 
                        type="password" 
                        placeholder="Ingrese el código de 9 dígitos" 
                        value={codigoInput}
                        onChange={(e) => setCodigoInput(e.target.value)}
                        className="w-full text-center bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 text-lg font-mono font-black focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white"
                        autoFocus
                      />
                      {errorCodigo && (
                        <p className="text-xs text-rose-500 font-semibold mt-2 text-center flex items-center justify-center gap-1">
                          <i data-lucide="alert-circle" className="w-3.5 h-3.5"></i>
                          {errorCodigo}
                        </p>
                      )}
                    </div>

                    <button 
                      type="submit"
                      className="w-full bg-slate-900 hover:bg-indigo-600 dark:bg-zinc-800 dark:hover:bg-indigo-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg text-sm"
                    >
                      Conectar Terminal
                    </button>
                  </form>
                </div>
              </div>
            ) : !role ? (
              /* 2. PANTALLA DE SELECCIÓN DE ROL (SÓLO SI ACCESO GENERAL CONFIRMADO) */
              <div className="max-w-4xl mx-auto py-12 md:py-20">
                <div className="text-center mb-12">
                  <span className="text-xs bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 font-bold px-3 py-1.5 rounded-full border border-indigo-100 dark:border-indigo-900/40 uppercase tracking-wider">Sesión Conectada Exitosamente</span>
                  <h2 className="text-3xl md:text-5xl font-black text-slate-900 dark:text-white tracking-tight mt-4">
                    Seleccione su Espacio de Trabajo
                  </h2>
                  <p className="text-slate-500 dark:text-zinc-400 text-sm md:text-base max-w-2xl mx-auto mt-2">
                    Las comandas y actualizaciones se sincronizarán inmediatamente entre todos los dispositivos que compartan este canal.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {/* Rol Mesero */}
                  <button 
                    onClick={() => { setRole('mesero'); mostrarNotificacion("Iniciando Interfaz de Ventas.", "info"); }}
                    className="group bg-white dark:bg-zinc-900 border border-slate-100 dark:border-zinc-800 hover:border-indigo-500 dark:hover:border-indigo-400 p-8 rounded-3xl text-left shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col justify-between h-[280px]"
                  >
                    <div className="bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 p-4 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                      <i data-lucide="clipboard-list" className="w-8 h-8"></i>
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">Mesas y Habitaciones</h3>
                      <p className="text-sm text-slate-500 dark:text-zinc-400 mt-2">Tome comandas del menú real creado por el administrador, añada observaciones y monitoree estados.</p>
                    </div>
                    <div className="flex items-center gap-1.5 text-xs font-bold text-indigo-600 dark:text-indigo-400 mt-4">
                      Abrir Comandero <i data-lucide="arrow-right" className="w-4 h-4"></i>
                    </div>
                  </button>

                  {/* Rol Cocina */}
                  <button 
                    onClick={() => { setRole('cocina'); mostrarNotificacion("Iniciando Monitor de Cocina.", "info"); }}
                    className="group bg-white dark:bg-zinc-900 border border-slate-100 dark:border-zinc-800 hover:border-amber-500 dark:hover:border-amber-400 p-8 rounded-3xl text-left shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col justify-between h-[280px]"
                  >
                    <div className="bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 p-4 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                      <i data-lucide="chef-hat" className="w-8 h-8"></i>
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-slate-900 dark:text-white group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">Cocina & Barra</h3>
                      <p className="text-sm text-slate-500 dark:text-zinc-400 mt-2">Reciba comandas reales al instante, organice prioridades de preparación y notifique despachos.</p>
                    </div>
                    <div className="flex items-center gap-1.5 text-xs font-bold text-amber-600 dark:text-amber-400 mt-4">
                      Ver Monitor de Producción <i data-lucide="arrow-right" className="w-4 h-4"></i>
                    </div>
                  </button>

                  {/* Rol Administración */}
                  <button 
                    onClick={() => setModalPasswordAdmin(true)}
                    className="group bg-white dark:bg-zinc-900 border border-slate-100 dark:border-zinc-800 hover:border-emerald-500 dark:hover:border-emerald-400 p-8 rounded-3xl text-left shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col justify-between h-[280px]"
                  >
                    <div className="bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 p-4 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                      <i data-lucide="sliders" className="w-8 h-8"></i>
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">Administración</h3>
                      <p className="text-sm text-slate-500 dark:text-zinc-400 mt-2">Gestione el catálogo de platos de manera estrictamente manual, audite ventas y configure accesos.</p>
                    </div>
                    <div className="flex items-center gap-1.5 text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-4">
                      Panel de Control Seguro <i data-lucide="arrow-right" className="w-4 h-4"></i>
                    </div>
                  </button>
                </div>
              </div>
            ) : role === 'mesero' ? (
              <WaiterInterface 
                menu={menu} 
                categorias={categorias} 
                pedidos={pedidos} 
                setPedidos={setPedidos} 
                mostrarNotificacion={mostrarNotificacion} 
              />
            ) : role === 'cocina' ? (
              <KitchenInterface 
                pedidos={pedidos} 
                setPedidos={setPedidos} 
                mostrarNotificacion={mostrarNotificacion} 
              />
            ) : (
              <AdminInterface 
                menu={menu} 
                setMenu={setMenu}
                categorias={categorias} 
                setCategorias={setCategorias}
                pedidos={pedidos} 
                setPedidos={setPedidos}
                adminPassword={adminPassword}
                setAdminPassword={setAdminPassword}
                mostrarNotificacion={mostrarNotificacion} 
              />
            )}
          </main>

          {/* FOOTER GENERAL */}
          <footer className="bg-white dark:bg-zinc-900 border-t border-slate-100 dark:border-zinc-800 py-6 mt-12 transition-colors">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <p className="text-xs text-slate-400 dark:text-zinc-500 font-medium">
                © 2026 GastroSync. Terminal Privado Conectado de Forma Segura.
              </p>
            </div>
          </footer>

          {/* MODAL CONTRASEÑA ROL ADMIN */}
          {modalPasswordAdmin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-zinc-900 border border-slate-100 dark:border-zinc-800 rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl relative">
                <button 
                  onClick={() => { setModalPasswordAdmin(false); setPassInput(""); setPassError(""); }} 
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white"
                >
                  <i data-lucide="x" className="w-6 h-6"></i>
                </button>

                <div className="text-center mb-6">
                  <div className="inline-block bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 p-3.5 rounded-2xl mb-3">
                    <i data-lucide="lock" className="w-6 h-6"></i>
                  </div>
                  <h3 className="text-xl font-bold text-slate-900 dark:text-white">Acceso de Administración</h3>
                  <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1">Clave exclusiva para panel de gestión de menú</p>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 dark:text-zinc-400 uppercase tracking-wider mb-1.5">Contraseña de Administrador</label>
                    <input 
                      type="password" 
                      placeholder="••••••••" 
                      value={passInput}
                      onChange={(e) => setPassInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && intentarAccesoAdmin()}
                      className="w-full bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-2xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white"
                      autoFocus
                    />
                    {passError && <p className="text-xs text-rose-500 font-semibold mt-1.5">{passError}</p>}
                  </div>

                  <button 
                    onClick={intentarAccesoAdmin}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-600/25 text-sm"
                  >
                    Confirmar Contraseña
                  </button>
                  <p className="text-[10px] text-center text-slate-400">Contraseña inicial por defecto: <span className="font-bold">admin123</span></p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // INTERFAZ DE MESEROS (100% OPERATIVA Y MANUAL)
    // ==========================================
    function WaiterInterface({ menu, categorias, pedidos, setPedidos, mostrarNotificacion }) {
      const [filtroCategoria, setFiltroCategoria] = useState("Todos");
      const [mesaInput, setMesaInput] = useState("");
      const [habitacionInput, setHabitacionInput] = useState("");
      const [meseroResponsable, setMeseroResponsable] = useState("");
      const [carrito, setCarrito] = useState([]);
      const [busqueda, setBusqueda] = useState("");

      // Filtrar platos que estén activos y creados por el administrador
      const productosFiltrados = menu.filter(item => {
        const coincideCat = filtroCategoria === "Todos" || item.categoria === filtroCategoria;
        const coincideBusqueda = item.nombre.toLowerCase().includes(busqueda.toLowerCase()) || 
                                 item.descripcion.toLowerCase().includes(busqueda.toLowerCase());
        return item.activa && coincideCat && coincideBusqueda;
      });

      // Añadir al carrito manualmente
      const agregarAlCarrito = (producto) => {
        const itemExistente = carrito.find(item => item.productoId === producto.id);
        if (itemExistente) {
          setCarrito(carrito.map(item => 
            item.productoId === producto.id ? { ...item, cantidad: item.cantidad + 1 } : item
          ));
        } else {
          setCarrito([...carrito, {
            productoId: producto.id,
            nombre: producto.nombre,
            precio: producto.precio,
            cantidad: 1,
            observaciones: ""
          }]);
        }
        mostrarNotificacion(`Agregado manual: ${producto.nombre}`);
      };

      // Modificar cantidad manualmente
      const cambiarCantidad = (id, incremento) => {
        setCarrito(carrito.map(item => {
          if (item.productoId === id) {
            const nuevaCant = item.cantidad + incremento;
            return nuevaCant > 0 ? { ...item, cantidad: nuevaCant } : item;
          }
          return item;
        }).filter(item => item.cantidad > 0));
      };

      // Notas de la comanda
      const actualizarObservacion = (id, notas) => {
        setCarrito(carrito.map(item => 
          item.productoId === id ? { ...item, observaciones: notas } : item
        ));
      };

      const totalCarrito = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      // Confirmar y Enviar Pedido Manual
      const enviarPedidoCompleto = (e) => {
        e.preventDefault();
        
        // Validaciones estrictas exigidas
        if (!meseroResponsable.trim()) {
          mostrarNotificacion("Debe ingresar obligatoriamente el Nombre del Mesero.", "error");
          return;
        }
        if (!mesaInput.trim()) {
          mostrarNotificacion("Debe ingresar obligatoriamente un Número de Mesa.", "error");
          return;
        }
        if (carrito.length === 0) {
          mostrarNotificacion("El carrito está vacío. Agregue platos manualmente.", "error");
          return;
        }

        const nuevoPedido = {
          id: Date.now(),
          mesa: mesaInput,
          habitacion: habitacionInput,
          mesero: meseroResponsable,
          items: [...carrito],
          estado: 'recibido',
          creado_en: new Date().toISOString(),
          actualizado_en: new Date().toISOString(),
          tiempoPreparacion: null
        };

        const listadoPedidosActualizado = [...pedidos, nuevoPedido];
        setPedidos(listadoPedidosActualizado);
        
        // Sincronización instantánea a través del evento del storage
        localStorage.setItem('gastrosync_pedidos', JSON.stringify(listadoPedidosActualizado));

        // Limpieza de interfaz
        setCarrito([]);
        setMesaInput("");
        setHabitacionInput("");
        mostrarNotificacion("¡Pedido registrado y enviado a cocina con éxito!", "success");
      };

      const misPedidos = pedidos.filter(p => p.estado !== 'despachado').reverse();

      return (
        <div className="space-y-8 animate-fade-in">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Atención y Toma de Comandas</h2>
              <p className="text-sm text-slate-500 dark:text-zinc-400 mt-1">Gestión 100% manual. No se simulan datos ni se generan órdenes fantasmas.</p>
            </div>
            
            <div className="relative w-full md:w-80">
              <input 
                type="text" 
                placeholder="Buscar plato en el menú..."
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                className="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white"
              />
              <i data-lucide="search" className="absolute left-3.5 top-3 w-4.5 h-4.5 text-slate-400"></i>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            {/* SECCIÓN CATÁLOGO DEL MENÚ (MANUAL) */}
            <div className="lg:col-span-2 space-y-6">
              
              <div className="flex gap-2 overflow-x-auto pb-2">
                <button

                  className={`px-5 py-2.5 rounded-full text-xs font-bold whitespace-nowrap transition-all border ${
                    filtroCategoria === "Todos" 
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-600/25' 
                      : 'bg-white dark:bg-zinc-900 text-slate-600 dark:text-zinc-400 border-slate-200 dark:border-zinc-800 hover:bg-slate-50'

                  Todos los platos

                {categorias.map(cat => (
                  <button 
                    key={cat}

              </div>

              {productosFiltrados.length === 0 ? (
                <div className="bg-white dark:bg-zinc-900 p-16 text-center rounded-3xl border border-dashed border-slate-200 dark:border-zinc-800 shadow-sm">

                  <h4 className="text-sm font-bold text-slate-800 dark:text-zinc-200">No hay platos disponibles</h4>
                  <p className="text-xs text-slate-500 dark:text-zinc-400 mt-1 max-w-sm mx-auto">
                    Solo se mostrarán platos reales cargados manualmente por el administrador en el Panel de Administración.
                  </p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {productosFiltrados.map(platillo => (
                    <div 
                      key={platillo.id}
                      className="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-100 dark:border-zinc-800 p-4 shadow-sm flex gap-4 hover:shadow-lg transition-all"
                    >
                      <img 
                        src={platillo.imagen} 
                        alt={platillo.nombre} 
                        className="w-24 h-24 object-cover rounded-xl bg-slate-100 dark:bg-zinc-800 shrink-0"
                        onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=150&q=80" }}
                      />
                      <div className="flex-grow flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start gap-1">
                            <h4 className="font-bold text-slate-900 dark:text-white text-sm line-clamp-1">{platillo.nombre}</h4>
                            <span className="text-[9px] bg-slate-100 dark:bg-zinc-850 text-slate-600 dark:text-zinc-400 px-1.5 py-0.5 rounded font-bold uppercase shrink-0">{platillo.categoria}</span>
                          </div>

                          <button

                      </div>
                    </div>
                  ))}

            </div>

            {/* SECCIÓN REGISTRO DE PEDIDO */}
            <div className="space-y-6">
              <div className="bg-white dark:bg-zinc-900 rounded-3xl border border-slate-100 dark:border-zinc-800 p-6 shadow-md sticky top-24">
                <div className="border-b border-slate-100 dark:border-zinc-800 pb-4 mb-4">
                  <h3 className="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">

                  </h3>
                  <p className="text-xs text-slate-400 dark:text-zinc-500 mt-0.5">La validación requiere datos reales del servicio</p>

                <form onSubmit={enviarPedidoCompleto} className="space-y-4">
                  
                  {/* Datos del Responsable de Mesa */}
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider mb-1">Mesero Responsable *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="Nombre del Mesero" 
                      value={meseroResponsable}
                      onChange={(e) => setMeseroResponsable(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider mb-1">Mesa *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Mesa" 
                        value={mesaInput}
                        onChange={(e) => setMesaInput(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider mb-1">Habitación</label>
                      <input 
                        type="text" 
                        placeholder="Opcional" 
                        value={habitacionInput}
                        onChange={(e) => setHabitacionInput(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all dark:text-white font-bold"
                      />
                    </div>
                  </div>

                  {/* Elementos agregados al pedido */}
                  <div className="space-y-3 max-h-[220px] overflow-y-auto pr-1">
                    {carrito.length === 0 ? (
                      <div className="text-center py-8 text-slate-400 dark:text-zinc-600 border border-dashed border-slate-100 dark:border-zinc-800 rounded-2xl">
                        <i data-lucide="shopping-bag" className="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p className="text-xs font-semibold">Seleccione platos para esta mesa</p>
                      </div>
                    ) : (
                      carrito.map(item => (
                        <div key={item.productoId} className="bg-slate-50 dark:bg-zinc-950 p-3 rounded-2xl space-y-2 border border-slate-100/50 dark:border-zinc-900">
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-bold text-xs text-slate-900 dark:text-white line-clamp-1">{item.nombre}</span>
                            <span className="text-xs text-slate-500 dark:text-zinc-400 font-extrabold shrink-0">${(item.precio * item.cantidad).toLocaleString('es-ES')}</span>
                          </div>
                          
                          <div className="flex justify-between items-center">
                            <input 
                              type="text" 
                              placeholder="Observación (Ej: Sin salsas)" 
                              value={item.observaciones}
                              onChange={(e) => actualizarObservacion(item.productoId, e.target.value)}
                              className="bg-transparent text-[10px] text-slate-500 dark:text-zinc-400 border-b border-slate-200 dark:border-zinc-800 w-2/3 outline-none focus:border-indigo-500 transition-colors"
                            />
                            
                            <div className="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-1 shrink-0 shadow-sm">
                              <button type="button" onClick={() => cambiarCantidad(item.productoId, -1)} className="p-1 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors">
                                <i data-lucide="minus" className="w-3 h-3"></i>
                              </button>
                              <span className="text-xs font-extrabold text-slate-900 dark:text-white min-w-[14px] text-center">{item.cantidad}</span>
                              <button type="button" onClick={() => cambiarCantidad(item.productoId, 1)} className="p-1 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors">
                                <i data-lucide="plus" className="w-3 h-3"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Resumen Total */}
                  {carrito.length > 0 && (
                    <div className="bg-slate-50 dark:bg-zinc-950 p-4 rounded-2xl space-y-2.5">
                      <div className="flex justify-between text-xs text-slate-500 dark:text-zinc-400">
                        <span>Total de productos:</span>
                        <span className="font-bold text-slate-700 dark:text-white">{carrito.reduce((acc, it) => acc + it.cantidad, 0)} platos</span>
                      </div>
                      <div className="flex justify-between border-t border-slate-200 dark:border-zinc-800 pt-2.5">
                        <span className="text-sm font-black text-slate-900 dark:text-white">Subtotal comanda:</span>
                        <span className="text-base font-extrabold text-indigo-600 dark:text-indigo-400">${totalCarrito.toLocaleString('es-ES')}</span>
                      </div>
                    </div>
                  )}

                  <button 
                    type="submit" 
                    disabled={carrito.length === 0}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-55 disabled:hover:bg-indigo-600 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-600/25 text-sm uppercase tracking-wider"
                  >
                    Confirmar y Enviar Pedido
                  </button>
                </form>
              </div>
            </div>

          </div>

          {/* HISTORIAL Y SEGUIMIENTO EN VIVO PARA MESEROS */}
          <section className="bg-white dark:bg-zinc-900 rounded-3xl border border-slate-100 dark:border-zinc-800 p-6 shadow-md mt-6">
            <div className="border-b border-slate-100 dark:border-zinc-800 pb-4 mb-4">
              <h3 className="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                <i data-lucide="loader" className="w-5 h-5 text-indigo-500 animate-spin"></i>
                Seguimiento de Comandas en Vivo
              </h3>
              <p className="text-xs text-slate-400 dark:text-zinc-500">Se actualiza automáticamente al ritmo de la cocina</p>
            </div>

            {misPedidos.length === 0 ? (
              <div className="text-center py-10 text-slate-400 dark:text-zinc-600">
                <i data-lucide="clock" className="w-10 h-10 mx-auto mb-3 opacity-30"></i>
                <p className="text-sm font-semibold">No tiene comandas activas pendientes.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {misPedidos.map(p => (
                  <div key={p.id} className="border border-slate-100 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950 p-4 rounded-2xl space-y-4">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-xs text-indigo-600 dark:text-indigo-400 font-extrabold bg-indigo-50 dark:bg-indigo-950 px-2.5 py-1 rounded-full">

                        </span>
                        {p.habitacion && (
                          <span className="text-xs text-emerald-600 dark:text-emerald-400 font-extrabold bg-emerald-50 dark:bg-emerald-950 px-2.5 py-1 rounded-full ml-1.5">
                            Hab {p.habitacion}
                          </span>
                        )}
                      </div>
                      <span className="text-[10px] font-mono text-slate-400">{new Date(p.creado_en).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>

                    <div className="space-y-1.5 border-b border-slate-200/50 dark:border-zinc-800/40 pb-2">
                      <p className="text-[10px] text-slate-400 uppercase tracking-wider font-extrabold">Responsable: {p.mesero}</p>
                      {p.items.map((it, idx) => (

                          'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400'
                        }`}>

                        </span>
                      </div>

                      <div className="w-full bg-slate-200 dark:bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                        <div className={`h-full transition-all duration-500 ${

                        }`}></div>

                ))}
